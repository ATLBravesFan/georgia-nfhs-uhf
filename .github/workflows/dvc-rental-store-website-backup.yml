name: DVC Rental Store website backup

on:
  # GitHub's scheduler itself is kept as a five-minute safety net. The Cloudflare
  # Worker dispatches this workflow every minute through workflow_dispatch.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser script dependency
        working-directory: dvc-monitor
        run: npm install --omit=dev --no-audit --no-fund

      - name: Scrape DVC Rental Store website
        working-directory: dvc-monitor
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_INGEST_TOKEN: ${{ secrets.DVC_MONITOR_INGEST_TOKEN }}
          DVC_BROWSER_JOB: rental-store
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/browser-backups.mjs
