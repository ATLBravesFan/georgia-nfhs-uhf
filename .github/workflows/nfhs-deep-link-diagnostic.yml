name: NFHS Deep Link Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfhs-deep-link-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run deep-link diagnostic
        env:
          XTREAM_BASE_URL: ${{ secrets.XTREAM_BASE_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
          NFHS_CATEGORY_NAME: ${{ vars.NFHS_CATEGORY_NAME }}
        run: node scripts/nfhs-deep-link-diagnostic.mjs

      - name: Publish deep-link diagnostic only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nfhs-deep-link-diagnostic.json
          if git diff --cached --quiet; then
            echo "No deep-link diagnostic changes to publish."
            exit 0
          fi
          git commit -m "Update NFHS deep-link diagnostic"
          git push
