name: NFHS Provider Metadata Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: nfhs-provider-metadata-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check provider NFHS metadata
        env:
          XTREAM_BASE_URL: ${{ secrets.XTREAM_BASE_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
          NFHS_CATEGORY_NAME: ${{ vars.NFHS_CATEGORY_NAME }}
        run: node scripts/nfhs-provider-watch.mjs

      - name: Publish watch data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nfhs-provider-state.json public/nfhs-provider-watch.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No provider metadata changes to publish."
            exit 0
          fi
          git commit -m "Update NFHS provider metadata watch"
          git pull --rebase origin main
          git push
